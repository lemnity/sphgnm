name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои Pages конфликтуют: держим одну очередь.
# cancel-in-progress НЕ ставим — прерванный деплой оставляет сайт в полусостоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Сборка идёт до typecheck: типы для импорта картинок лежат в next-env.d.ts,
      # который в .gitignore и появляется только после `next build` (иначе TS2307).
      # GITHUB_PAGES включает статическую сборку и basePath /sphgnm.
      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      - run: npm run typecheck

      # Страховка на случай публикации из ветки: Jekyll выкинул бы папку _next.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
