name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои Pages конфликтуют: держим одну очередь.
# cancel-in-progress НЕ ставим — прерванный деплой оставляет сайт в полусостоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Сборка ИДЁТ ПЕРВОЙ, и это не косметика. Типы для импорта картинок
      # (import png from "./assets/...") объявлены в next-env.d.ts, а он в
      # .gitignore — в чистом клоне его нет, создаёт его сам `next build`.
      # Пока typecheck стоял раньше сборки, CI падал на TS2307 «Cannot find
      # module ./assets/moss-ledge.png», хотя локально всё проходило: там файл
      # оставался от прошлых сборок.
      #
      # GITHUB_PAGES включает basePath /sphgnm — сайт отдаётся из подпапки.
      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      - run: npm run typecheck

      # Pages при публикации через Actions Jekyll не запускает, но файл кладём:
      # если деплой когда-нибудь переключат на ветку, Jekyll выкинет папку _next
      # (всё, что начинается с подчёркивания) и сайт останется без стилей и JS.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
